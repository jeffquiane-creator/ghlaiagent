<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHL AI Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🤖 GHL AI Agent</h1>
                <p class="subtitle">Control your GoHighLevel with natural language</p>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <!-- Welcome Message -->
            <div class="message bot-message">
                <div class="message-content">
                    <div class="message-header">
                        <span class="bot-avatar">🤖</span>
                        <span class="message-sender">AI Agent</span>
                    </div>
                    <div class="message-text">
                        <p>👋 Hey! I'm your GoHighLevel AI assistant.</p>
                        <p>Tell me what you want to do and I'll make it happen!</p>
                        <div class="suggestions">
                            <p><strong>Try these:</strong></p>
                            <button class="suggestion-btn" onclick="sendSuggestion(this)">Add contact John Doe, email john@test.com, tag as Hot Lead</button>
                            <button class="suggestion-btn" onclick="sendSuggestion(this)">Search for contacts named Mike</button>
                            <button class="suggestion-btn" onclick="sendSuggestion(this)">Add note to John Doe: Very interested in properties</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="commandInput" 
                    placeholder="Type your command... (e.g., 'Add contact Sarah, email sarah@test.com')"
                    rows="1"
                ></textarea>
                <button id="sendButton" class="send-button" onclick="sendCommand()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Quick Actions (Mobile friendly) -->
        <div class="quick-actions" id="quickActions">
            <button class="quick-action" onclick="sendQuickAction('add contact')">
                ➕ Add Contact
            </button>
            <button class="quick-action" onclick="sendQuickAction('search contacts')">
                🔍 Search
            </button>
            <button class="quick-action" onclick="sendQuickAction('add note')">
                📝 Add Note
            </button>
            <button class="quick-action" onclick="sendQuickAction('add tag')">
                🏷️ Tag
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
